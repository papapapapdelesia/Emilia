name: Golang CF Scanning

on:
  workflow_dispatch: # Tombol manual untuk menjalankan workflow
  schedule:
    - cron: '0 */6 * * *' # Jalan otomatis tiap 6 jam

jobs:
  scan-proxies:
    runs-on: ubuntu-latest
    name: 🔎 Scan Proxy Go

    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GIT_TOKEN }}

    - name: 🛠️ Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: 🚀 Run Scanner
      env: 
        WORKER_URLS: ${{ secrets.WORKER_URLS }}
      run: |
        go run main.go

    - name: 📤 Commit Results
      if: success()
      run: |
        git config --global user.name "Github Actions"
        git config --global user.email "actions@github.com"
        git add Data/alive.txt Data/Country-ALIVE.txt
        git commit -m "🐦‍🔥 Update Proxy: alive.txt & Country-ALIVE.txt" || echo "No changes to commit"
        git push origin main
