name: Golang CF Scanning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Tiap 6 jam
  push:
    paths:
      - 'Data/active_from_b.txt'

jobs:
  scan-proxies:
    runs-on: ubuntu-latest
    name: 🔎 Scan Proxy Go

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 🔗 Merge Proxies (Deduplicate IP:PORT)
        run: |
          if [ -s Data/active_from_b.txt ]; then
            awk -F',' '!seen[$1":"$2]++' Data/proxy-26agustus.txt Data/active_from_b.txt > Data/merged_proxy.txt
            mv Data/merged_proxy.txt Data/proxy-26agustus.txt
          fi

      - name: 🚀 Run Scanner
        env: 
          WORKER_URLS: ${{ secrets.WORKER_URLS }}
        run: |
          go run main.go

      - name: 📤 Commit Results
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/alive.txt Data/Country-ALIVE.txt Data/proxy-26agustus.txt
          git commit -m "🦉 Update Proxy: alive.txt & Country-ALIVE.txt" || echo "No changes to commit"
          git push origin main
